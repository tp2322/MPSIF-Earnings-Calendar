<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPSIF — Earnings Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #eeede8;
    --border: #e2e1db;
    --border2: #d0cfc8;
    --text: #1a1917;
    --muted: #8a8880;
    --faint: #b5b3ae;
    --green: #1d6b42;
    --green-bg: #e8f5ee;
    --amber: #92520a;
    --amber-bg: #fef3e2;
    --red: #991919;
    --red-bg: #fdeaea;
    --blue: #1a4480;
    --blue-bg: #e8f0fc;
    --mono: 'Geist Mono', monospace;
    --sans: 'Instrument Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 28px; display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; z-index: 100; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--text); color: var(--bg); padding: 3px 8px; border-radius: 4px; letter-spacing: 0.06em; }
  .header-sub { font-size: 13px; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 10px; }

  /* Tab bar */
  .tab-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 28px; display: flex; align-items: center; gap: 2px; flex-shrink: 0;
  }
  .tab {
    padding: 12px 16px; font-size: 13px; font-weight: 500; color: var(--muted);
    border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s; display: flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab-icon { font-size: 14px; }

  /* Stats */
  .stats-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 28px; display: flex; align-items: stretch; flex-shrink: 0;
  }
  .stat-item { padding: 12px 24px 12px 0; margin-right: 24px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
  .stat-item:last-child { border-right: none; }
  .stat-num { font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Body */
  .body-wrap { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto; }
  .sidebar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin-bottom: 8px; padding: 0 4px; }
  .filter-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px; margin-bottom: 3px; background: transparent; border: none; border-radius: 7px; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: left; transition: all 0.12s; }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { background: var(--text); color: var(--bg); }
  .filter-btn.active .pill { background: rgba(255,255,255,0.2); color: #fff; }
  .filter-btn:hover .pill { background: var(--border2); }
  .pill { font-family: var(--mono); font-size: 10px; font-weight: 600; background: var(--surface2); color: var(--muted); padding: 2px 6px; border-radius: 10px; min-width: 20px; text-align: center; transition: all 0.12s; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 10px 0; }

  /* Main */
  .main { flex: 1; overflow-y: auto; }

  /* ===== LIST VIEW ===== */
  .list-view { padding: 20px 24px; }

  .add-form { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin-bottom: 18px; display: none; animation: slideDown 0.15s ease; }
  .add-form.open { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .form-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 14px; }
  .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .form-field input, .form-field select { background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 11px; font-family: var(--sans); font-size: 13px; color: var(--text); outline: none; height: 36px; transition: border-color 0.15s; }
  .form-field input:focus, .form-field select:focus { border-color: var(--text); }
  .form-field input::placeholder { color: var(--faint); }
  .f-ticker { width: 100px; font-family: var(--mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .f-company { width: 190px; }
  .f-date { width: 155px; }
  .f-time { width: 165px; }
  .f-analyst { width: 155px; }
  .form-actions { display: flex; gap: 8px; }
  .btn-submit { padding: 8px 18px; border-radius: 7px; background: var(--text); color: var(--bg); font-family: var(--sans); font-weight: 500; font-size: 13px; border: none; cursor: pointer; height: 36px; white-space: nowrap; transition: opacity 0.15s; }
  .btn-submit:hover { opacity: 0.8; }
  .btn-cancel { padding: 8px 14px; border-radius: 7px; background: transparent; color: var(--muted); font-family: var(--sans); font-size: 13px; border: 1px solid var(--border2); cursor: pointer; height: 36px; transition: all 0.15s; }
  .btn-cancel:hover { color: var(--text); background: var(--bg); }

  .add-trigger-btn { display: flex; align-items: center; gap: 7px; padding: 8px 16px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .add-trigger-btn:hover { opacity: 0.85; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { padding: 10px 14px; text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; background: var(--surface2); border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  tbody tr.past { opacity: 0.5; }
  td { padding: 13px 14px; vertical-align: middle; }
  .td-ticker { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; }
  .td-company { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-date { font-family: var(--mono); font-size: 12px; }
  .td-when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .td-time { font-size: 12px; color: var(--muted); }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; font-family: var(--mono); white-space: nowrap; }
  .badge-today { background: #fff0e0; color: #c45000; border: 1px solid #f5c890; }
  .badge-week { background: var(--amber-bg); color: var(--amber); border: 1px solid #f0d4a8; }
  .badge-upcoming { background: var(--green-bg); color: var(--green); border: 1px solid #b8deca; }
  .badge-reported { background: var(--surface2); color: var(--faint); border: 1px solid var(--border); }
  .badge-tbd { background: var(--blue-bg); color: var(--blue); border: 1px solid #c0d4f5; }

  .row-actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition: opacity 0.15s; }
  tbody tr:hover .row-actions { opacity: 1; }
  .action-btn { background: none; border: 1px solid var(--border2); border-radius: 5px; padding: 3px 8px; font-size: 11px; color: var(--muted); cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
  .action-btn:hover { color: var(--text); background: var(--bg); }
  .action-btn.del:hover { color: var(--red); border-color: #f5c0c0; background: var(--red-bg); }

  .empty { padding: 56px 24px; text-align: center; }
  .empty-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 20px; }
  .empty h3 { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .empty p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .empty-add { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--text); color: var(--bg); font-family: var(--sans); font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
  .empty-add:hover { opacity: 0.8; }

  /* ===== CALENDAR VIEW ===== */
  .cal-view { padding: 20px 24px; display: none; }

  .cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .cal-nav-btn { background: var(--surface); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 12px; font-size: 16px; cursor: pointer; color: var(--muted); transition: all 0.15s; line-height: 1; }
  .cal-nav-btn:hover { color: var(--text); background: var(--surface2); }
  .cal-month-label { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); min-width: 160px; }
  .cal-today-btn { margin-left: auto; padding: 7px 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: 7px; font-family: var(--sans); font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .cal-today-btn:hover { color: var(--text); background: var(--surface2); }

  .cal-grid { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .cal-dow { padding: 10px 0; text-align: center; font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); background: var(--surface2); }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-cell {
    min-height: 100px; padding: 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    position: relative; vertical-align: top; transition: background 0.1s;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.other-month { background: var(--bg); }
  .cal-cell.other-month .cal-day-num { color: var(--faint); }
  .cal-cell.is-today { background: #fffbf2; }
  .cal-cell.is-today .cal-day-num {
    background: var(--text); color: var(--bg);
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  .cal-day-num { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .cal-events { display: flex; flex-direction: column; gap: 3px; }
  .cal-event {
    padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: default; font-family: var(--mono); letter-spacing: 0.02em;
    border-left: 3px solid;
  }
  .cal-event.status-today { background: #fff0e0; color: #c45000; border-left-color: #f5a050; }
  .cal-event.status-week { background: var(--amber-bg); color: var(--amber); border-left-color: #e8a050; }
  .cal-event.status-upcoming { background: var(--green-bg); color: var(--green); border-left-color: #4aab72; }
  .cal-event.status-reported { background: var(--surface2); color: var(--faint); border-left-color: var(--border2); }
  .cal-overflow { font-size: 10px; color: var(--faint); font-family: var(--mono); padding: 2px 4px; }

  .cal-legend { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">MPSIF</span>
    <span class="header-sub">Earnings Calendar</span>
  </div>
  <div class="header-right">
    <button class="add-trigger-btn" onclick="toggleForm()">+ Add position</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab active" id="tab-list" onclick="switchTab('list')">
    <span class="tab-icon">☰</span> List
  </button>
  <button class="tab" id="tab-cal" onclick="switchTab('cal')">
    <span class="tab-icon">⊞</span> Calendar
  </button>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="s-total">0</div><div class="stat-label">Positions</div></div>
  <div class="stat-item"><div class="stat-num" style="color:var(--amber)" id="s-week">0</div><div class="stat-label">This week</div></div>
  <div class="stat-item"><div class="stat-num" style="color:var(--green)" id="s-upcoming">0</div><div class="stat-label">Upcoming</div></div>
  <div class="stat-item"><div class="stat-num" style="color:var(--faint)" id="s-reported">0</div><div class="stat-label">Reported</div></div>
</div>

<div class="body-wrap">
  <div class="sidebar">
    <div class="sidebar-label">Analyst</div>
    <button class="filter-btn active" onclick="setAnalyst('all', this)">All <span class="pill" id="pill-all">0</span></button>
    <div class="sidebar-divider"></div>
    <div id="analyst-list"></div>
  </div>

  <div class="main">

    <!-- LIST VIEW -->
    <div class="list-view" id="list-view">
      <div class="add-form" id="add-form">
        <div class="form-title">New position</div>
        <div class="form-row">
          <div class="form-field"><label>Ticker</label><input class="f-ticker" id="f-ticker" type="text" placeholder="AAPL" maxlength="10" onkeydown="handleKey(event)"/></div>
          <div class="form-field"><label>Company <span style="font-weight:400;color:var(--faint)">(opt.)</span></label><input class="f-company" id="f-company" type="text" placeholder="Apple Inc." onkeydown="handleKey(event)"/></div>
          <div class="form-field"><label>Earnings date</label><input class="f-date" id="f-date" type="date" onkeydown="handleKey(event)"/></div>
          <div class="form-field"><label>Timing</label>
            <select class="f-time" id="f-time">
              <option value="">Unknown</option>
              <option value="Before open">Before open</option>
              <option value="After close">After close</option>
              <option value="During market hours">During market hours</option>
            </select>
          </div>
          <div class="form-field"><label>Analyst</label>
            <select class="f-analyst" id="f-analyst">
              <option value="">Select...</option>
              <option>Augustine</option><option>Boid</option><option>Jake</option>
              <option>Kartik</option><option>Leah</option><option>Nihir</option>
              <option>Rachel</option><option>Sina</option><option>Tejas</option><option>Zach</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="btn-submit" onclick="submit()">Add</button>
            <button class="btn-cancel" onclick="closeForm()">Cancel</button>
          </div>
        </div>
      </div>
      <div id="list-content"></div>
    </div>

    <!-- CALENDAR VIEW -->
    <div class="cal-view" id="cal-view">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="moveMonth(-1)">&#8249;</button>
        <div class="cal-month-label" id="cal-label"></div>
        <button class="cal-nav-btn" onclick="moveMonth(1)">&#8250;</button>
        <button class="cal-today-btn" onclick="goToday()">Today</button>
      </div>
      <div class="cal-grid">
        <div class="cal-dow-row">
          <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
          <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
        </div>
        <div class="cal-days" id="cal-days"></div>
      </div>
      <div class="cal-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#f5a050"></div>Today</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e8a050"></div>This week</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4aab72"></div>Upcoming</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--border2)"></div>Reported</div>
        <div class="legend-item" style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)" id="cal-filter-label"></div>
      </div>
    </div>

  </div>
</div>

let activeAnalyst = 'all';
let activeTab = 'list';
let formOpen = false;
let calYear, calMonth;

const now = new Date();
calYear = now.getFullYear();
calMonth = now.getMonth();

buildSidebar();
render();

function save() {  }

// ---- TABS ----
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('list-view').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('cal-view').style.display = tab === 'cal' ? 'block' : 'none';
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('tab-cal').classList.toggle('active', tab === 'cal');
  if (tab === 'cal') renderCalendar();
}

// ---- FORM ----
function toggleForm() {
  formOpen = !formOpen;
  document.getElementById('add-form').classList.toggle('open', formOpen);
  if (activeTab === 'cal') { switchTab('list'); }
  if (formOpen) setTimeout(() => document.getElementById('f-ticker').focus(), 60);
}
function closeForm() { formOpen = false; document.getElementById('add-form').classList.remove('open'); clearForm(); }
function clearForm() {
  ['f-ticker','f-company','f-date'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-time').value = '';
  document.getElementById('f-analyst').value = '';
}
function handleKey(e) { if (e.key === 'Enter') submit(); if (e.key === 'Escape') closeForm(); }

function submit() {
  const ticker = document.getElementById('f-ticker').value.trim().toUpperCase().replace(/[^A-Z.]/g,'');
  if (!ticker) { flash('f-ticker'); return; }
  if (entries.find(e => e.ticker === ticker)) { alert(ticker + ' is already in your calendar.'); return; }
  entries.push({
    id: Date.now(), ticker,
    company: document.getElementById('f-company').value.trim(),
    date: document.getElementById('f-date').value || null,
    time: document.getElementById('f-time').value,
    analyst: document.getElementById('f-analyst').value,
    addedAt: new Date().toISOString()
  });
  save(); closeForm(); render();
  if (activeTab === 'cal') renderCalendar();
}

function flash(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--red)'; el.focus();
  setTimeout(() => el.style.borderColor = '', 900);
}

function removeEntry(id) { entries = entries.filter(e => e.id !== id); save(); render(); if (activeTab === 'cal') renderCalendar(); }

// ---- FILTER ----
function setAnalyst(analyst, btn) {
  activeAnalyst = analyst;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
  if (activeTab === 'cal') renderCalendar();
}

function buildSidebar() {
  const list = document.getElementById('analyst-list');
  list.innerHTML = '';
  ANALYSTS.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.id = 'btn-' + name;
    btn.innerHTML = name + ' <span class="pill" id="pill-' + name + '">0</span>';
    btn.onclick = function() { setAnalyst(name, this); };
    list.appendChild(btn);
  });
}

// ---- HELPERS ----
function getDiff(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((d - n) / 86400000);
}
function getEventClass(dateStr) {
  if (!dateStr) return 'status-reported';
  const diff = getDiff(dateStr);
  if (diff === 0) return 'status-today';
  if (diff < 0) return 'status-reported';
  if (diff <= 7) return 'status-week';
  return 'status-upcoming';
}
function getBadge(dateStr) {
  if (!dateStr) return '<span class="badge badge-tbd">TBD</span>';
  const diff = getDiff(dateStr);
  if (diff === 0) return '<span class="badge badge-today">Today</span>';
  if (diff < 0) return '<span class="badge badge-reported">Reported</span>';
  if (diff <= 7) return '<span class="badge badge-week">This week</span>';
  return '<span class="badge badge-upcoming">Upcoming</span>';
}
function getWhen(dateStr) {
  if (!dateStr) return '—';
  const diff = getDiff(dateStr);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff < 0) return Math.abs(diff) + 'd ago';
  return 'in ' + diff + 'd';
}
function fmtDate(dateStr) {
  if (!dateStr) return 'TBD';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ---- LIST RENDER ----
function render() {
  const all = [...entries].sort((a,b) => { if(!a.date) return 1; if(!b.date) return -1; return new Date(a.date)-new Date(b.date); });

  document.getElementById('s-total').textContent = all.length;
  document.getElementById('s-week').textContent = all.filter(e => { const d=getDiff(e.date); return d!==null&&d>=0&&d<=7; }).length;
  document.getElementById('s-upcoming').textContent = all.filter(e => { const d=getDiff(e.date); return d!==null&&d>=0; }).length;
  document.getElementById('s-reported').textContent = all.filter(e => { const d=getDiff(e.date); return d!==null&&d<0; }).length;

  document.getElementById('pill-all').textContent = all.length;
  ANALYSTS.forEach(name => {
    const pill = document.getElementById('pill-' + name);
    if (pill) pill.textContent = all.filter(e => e.analyst === name).length;
  });

  const data = activeAnalyst === 'all' ? all : all.filter(e => e.analyst === activeAnalyst);
  const el = document.getElementById('list-content');

  if (data.length === 0) {
    const isFiltered = activeAnalyst !== 'all';
    el.innerHTML = `<div class="empty"><div class="empty-icon">📅</div><h3>${isFiltered?'No positions for '+activeAnalyst:'No positions yet'}</h3><p>${isFiltered?'This analyst has no earnings dates on the calendar.':'Add your first position to start tracking.'}</p>${!isFiltered?'<button class="empty-add" onclick="toggleForm()">+ Add position</button>':''}</div>`;
    return;
  }

  let rows = '';
  data.forEach(e => {
    const diff = getDiff(e.date);
    const isPast = diff !== null && diff < 0;
    rows += `<tr class="${isPast?'past':''}" id="row-${e.id}">
      <td class="td-ticker">${e.ticker}</td>
      <td class="td-company">${e.company||'<span style="color:var(--faint)">—</span>'}</td>
      <td class="td-date">${fmtDate(e.date)}</td>
      <td>${getBadge(e.date)}</td>
      <td class="td-when">${getWhen(e.date)}</td>
      <td class="td-time">${e.time||'—'}</td>
      <td>${e.analyst||'<span style="color:var(--faint)">—</span>'}</td>
      <td><div class="row-actions">
        <button class="action-btn" onclick="editEntry(${e.id})">Edit</button>
        <button class="action-btn del" onclick="removeEntry(${e.id})">Remove</button>
      </div></td>
    </tr>`;
  });

  el.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>
      <th style="width:9%">Ticker</th><th style="width:15%">Company</th><th style="width:14%">Date</th>
      <th style="width:11%">Status</th><th style="width:9%">When</th><th style="width:14%">Timing</th>
      <th style="width:13%">Analyst</th><th style="width:8%"></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function editEntry(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const row = document.getElementById('row-' + id);
  const analystOpts = ['','Augustine','Boid','Jake','Kartik','Leah','Nihir','Rachel','Sina','Tejas','Zach']
    .map(a => `<option value="${a}" ${e.analyst===a?'selected':''}>${a||'Select...'}</option>`).join('');
  row.innerHTML = `<td colspan="8" style="padding:10px 12px">
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <div class="form-field"><label>Ticker</label><input class="f-ticker" id="e-ticker" value="${e.ticker}" style="width:90px" onkeydown="if(event.key==='Enter')saveEdit(${id});if(event.key==='Escape')render()"/></div>
      <div class="form-field"><label>Company</label><input class="f-company" id="e-company" value="${e.company||''}" style="width:170px" onkeydown="if(event.key==='Enter')saveEdit(${id});if(event.key==='Escape')render()"/></div>
      <div class="form-field"><label>Date</label><input class="f-date" id="e-date" type="date" value="${e.date||''}" style="width:150px"/></div>
      <div class="form-field"><label>Timing</label>
        <select id="e-time" class="f-time" style="width:155px">
          <option value="" ${!e.time?'selected':''}>Unknown</option>
          <option value="Before open" ${e.time==='Before open'?'selected':''}>Before open</option>
          <option value="After close" ${e.time==='After close'?'selected':''}>After close</option>
          <option value="During market hours" ${e.time==='During market hours'?'selected':''}>During market hours</option>
        </select>
      </div>
      <div class="form-field"><label>Analyst</label><select id="e-analyst" class="f-analyst" style="width:145px">${analystOpts}</select></div>
      <div class="form-actions">
        <button class="btn-submit" onclick="saveEdit(${id})">Save</button>
        <button class="btn-cancel" onclick="render()">Cancel</button>
      </div>
    </div>
  </td>`;
  document.getElementById('e-ticker').focus();
}

function saveEdit(id) {
  const i = entries.findIndex(x => x.id === id);
  if (i === -1) return;
  entries[i].ticker = document.getElementById('e-ticker').value.trim().toUpperCase().replace(/[^A-Z.]/g,'') || entries[i].ticker;
  entries[i].company = document.getElementById('e-company').value.trim();
  entries[i].date = document.getElementById('e-date').value || null;
  entries[i].time = document.getElementById('e-time').value;
  entries[i].analyst = document.getElementById('e-analyst').value;
  save(); render();
}

// ---- CALENDAR RENDER ----
function moveMonth(dir) { calMonth += dir; if (calMonth > 11) { calMonth=0; calYear++; } if (calMonth < 0) { calMonth=11; calYear--; } renderCalendar(); }
function goToday() { const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); renderCalendar(); }

function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-label').textContent = monthNames[calMonth] + ' ' + calYear;

  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);
  const startPad = firstDay.getDay();
  const totalCells = Math.ceil((startPad + lastDay.getDate()) / 7) * 7;

  // Filter entries by analyst
  const filtered = activeAnalyst === 'all' ? entries : entries.filter(e => e.analyst === activeAnalyst);
  document.getElementById('cal-filter-label').textContent = activeAnalyst !== 'all' ? 'Filtered: ' + activeAnalyst : '';

  // Build date → entries map
  const byDate = {};
  filtered.forEach(e => { if (e.date) { if (!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); } });

  let html = '';
  for (let i = 0; i < totalCells; i++) {
    const dayOffset = i - startPad;
    const cellDate = new Date(calYear, calMonth, dayOffset + 1);
    const isCurrentMonth = cellDate.getMonth() === calMonth;
    const isToday = cellDate.getTime() === today.getTime();
    const dateStr = cellDate.toISOString().slice(0, 10);
    const dayEntries = byDate[dateStr] || [];

    let cellClass = 'cal-cell';
    if (!isCurrentMonth) cellClass += ' other-month';
    if (isToday) cellClass += ' is-today';

    const dayNumHtml = `<div class="cal-day-num">${cellDate.getDate()}</div>`;

    let eventsHtml = '<div class="cal-events">';
    const maxShow = 3;
    dayEntries.slice(0, maxShow).forEach(e => {
      const cls = getEventClass(dateStr);
      const label = e.ticker + (e.analyst ? ' · ' + e.analyst.slice(0,3) : '');
      eventsHtml += `<div class="cal-event ${cls}" title="${e.ticker}${e.company?' — '+e.company:''} | ${e.analyst||''}${e.time?' | '+e.time:''}">${label}</div>`;
    });
    if (dayEntries.length > maxShow) {
      eventsHtml += `<div class="cal-overflow">+${dayEntries.length - maxShow} more</div>`;
    }
    eventsHtml += '</div>';

    html += `<div class="${cellClass}">${dayNumHtml}${isCurrentMonth || dayEntries.length > 0 ? eventsHtml : ''}</div>`;
  }

  document.getElementById('cal-days').innerHTML = html;
}
